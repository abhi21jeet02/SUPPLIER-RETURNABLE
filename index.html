<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Components</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f4f6f8;
        }
        
        /* Banner Error Box */
        .alert-error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .alert-error .icon {
            font-weight: bold;
            font-size: 20px;
            margin-right: 12px;
        }

        /* Form Field Error Example */
        .form-group {
            margin-top: 20px;
            max-width: 300px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dc3545;
            border-radius: 4px;
            outline: none;
        }
        .error-text {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Top Alert Error Banner -->
    <div class="alert-error">
        <span class="icon">&#9888;</span>
        <div>
            <strong>Error:</strong> Unable to process your request. Please check your network connection and try again.
        </div>
    </div>

    <!-- Form Field with Error -->
    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" value="invalid-email-address">
        <div class="error-text">Please enter a valid email address.</div>
    </div>

</body>
</html>
